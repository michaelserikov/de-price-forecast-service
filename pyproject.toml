[project]
name = "dpfs"
version = "0.1.0"
description = "Day-ahead power price forecasts for Germany (DE-LU) with PyTorch, served through FastAPI and refreshed daily"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.3",
    "pandas>=2.2",
    "numpy>=2.0",
    "scipy>=1.13",
    "pyarrow>=15",
    "requests>=2.31",
    "openpyxl>=3.1",
    "matplotlib>=3.9",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
